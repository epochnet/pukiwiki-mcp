[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pukiwiki-mcp"
version = "1.0.0"
description = "MCP server exposing a PukiWiki site (read/write) as tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pukiwiki-mcp = "pukiwiki_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pukiwiki_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
